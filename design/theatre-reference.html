<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aegean — Το Θέατρο, ολόκληρο το show</title>
<style>
:root{
  --night-0:#070C18; --night-1:#13213D; --dusk:#5A3350; --ember:#E8A14A;
  --marble:#EDE6D6; --marble-2:#CFC5B0; --marble-3:#8F8672; --carve:#2B2418;
  --wine:#5B1424; --wine-2:#8E2440; --olive:#9AA860; --ice:#BFE6FF; --ink-blot:#12101A;
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --serif:"Gentium Book Plus",Georgia,"Times New Roman",serif;
  --slab:polygon(1.5% 0,98.5% .6%,100% 3%,99.4% 97%,98% 100%,2% 99.4%,0 96%,.6% 3%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--marble);font-family:var(--font)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.tv-wrap{width:min(100vw - 24px,calc((100vh - 110px) * 16 / 9));aspect-ratio:16/9;position:relative}
.tv{position:absolute;inset:0;overflow:hidden;container-type:size;background:var(--night-0)}
.scene{position:absolute;inset:0;transition:filter 500ms ease;transform-origin:50% 70%}
.scene svg{width:100%;height:100%;display:block}
.tv.cheer .scene{filter:brightness(1.18) saturate(1.1)}
.tv.boo .scene{filter:brightness(.6) saturate(.6)}
.tv.dimmed .scene{filter:brightness(.5) saturate(.8)}
.tv.gameover .scene{filter:brightness(1.1)}

@media (prefers-reduced-motion:no-preference){
  .scene{animation:drift 60s ease-in-out infinite alternate}
  @keyframes drift{to{transform:scale(1.035)}}
  .flame{animation:flick .17s steps(2) infinite alternate;transform-origin:50% 100%}
  .flame:nth-child(odd){animation-duration:.22s}
  @keyframes flick{to{transform:scale(1.12,.92);opacity:.85}}
  .glow{animation:glow 1.3s ease-in-out infinite alternate}
  @keyframes glow{to{opacity:.5}}
  .star{animation:tw 3s ease-in-out infinite alternate}
  @keyframes tw{to{opacity:.25}}
  .mote{animation:mote linear infinite}
  @keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}100%{transform:translate(30px,-140px);opacity:0}}
  .arm{transition:transform 350ms cubic-bezier(.2,.9,.3,1.3);transform-origin:50% 100%}
  .tier{transition:transform 400ms ease}
  .tv.socrates-phase .hand,.tv.steal .hand{animation:speak 2.6s ease-in-out infinite;transform-origin:15% 90%}
  @keyframes speak{40%{transform:rotate(-14deg)}70%{transform:rotate(5deg)}}
  .leaf{animation:sway 6s ease-in-out infinite alternate;transform-origin:0 100%}
  @keyframes sway{to{transform:rotate(1.6deg)}}
  .fall{animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),110cqh) rotate(540deg);opacity:.9}}
  .stroke{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 3.2s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .bob{animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-.6cqh)}}
}
.tv.cheer .arm{transform:rotate(-40deg) translateY(-4px)}
.tv.cheer .glow{opacity:1}
.tv.boo .tier{transform:translateY(5px) skewX(-3deg)}

/* generic marble slab */
.slab{position:absolute;color:var(--carve);padding:4.2cqh 5cqh;transition:opacity 350ms,transform 350ms;
  filter:drop-shadow(0 3cqh 4cqh rgba(0,0,0,.65));opacity:0;transform:translateY(1.5cqh);pointer-events:none}
.slab.on{opacity:1;transform:none}
.slab::before{content:"";position:absolute;inset:0;background:var(--marble);clip-path:var(--slab);z-index:-2}
.slab .vein{position:absolute;inset:0;z-index:-1;clip-path:var(--slab);opacity:.9}
.slab .vein svg{width:100%;height:100%;display:block}
.slab .lit{position:absolute;inset:0;z-index:-1;pointer-events:none;clip-path:var(--slab);
  background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 40%,transparent 70%,rgba(60,50,30,.28))}
#main{left:12%;top:8%;width:60%}
#speech{left:24%;bottom:38%;width:52%;font-family:var(--serif);font-size:4.8cqh;line-height:1.25;font-weight:700;padding:3.4cqh 4.5cqh;z-index:3}
.cat{font-size:2.5cqh;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--marble-3)}
.q{font-family:var(--serif);font-size:5.8cqh;line-height:1.2;font-weight:700;margin-top:1.2cqh;max-width:26ch;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.opts{margin-top:2.8cqh;display:grid;grid-template-columns:1fr 1fr;gap:1.2cqh 3.5cqh;font-size:4cqh;font-weight:700}
.opt{display:flex;align-items:center;gap:1.6cqh;opacity:.42}.opt.ok{opacity:1}
.opt.ok::before{content:"";width:1.6cqh;height:3cqh;border-right:.6cqh solid var(--wine-2);border-bottom:.6cqh solid var(--wine-2);transform:rotate(45deg) translate(-.3cqh,-.5cqh);flex:0 0 auto}
.big{font-family:var(--serif);font-size:12cqh;font-weight:700;line-height:1;margin-top:1cqh}
.mid{font-size:3.2cqh;margin-top:1.6cqh;color:var(--marble-3);font-weight:600}
.drawing{display:grid;grid-template-columns:auto 1fr;gap:4cqh;align-items:center}
.canvas{width:30cqh;height:30cqh;background:#F6EEDC;box-shadow:inset 0 0 0 .4cqh #CFC5B0}
.canvas svg{width:100%;height:100%}
.numline{margin-top:2.6cqh;height:6cqh;position:relative;border-bottom:.4cqh solid var(--marble-3)}
.numline i{position:absolute;bottom:0;width:.5cqh;height:3cqh;background:var(--marble-3);transform:translateX(-50%)}
.numline i.truth{background:var(--wine-2);height:5.4cqh;width:.7cqh}
.numline i::after{content:attr(data-l);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:2.2cqh;font-weight:700;white-space:nowrap;padding-bottom:.4cqh}
.numline i.truth::after{color:var(--wine-2);font-size:2.8cqh}

/* krater timer */
.krater{position:absolute;right:6%;top:13%;width:14cqh;height:26cqh;transition:opacity 350ms;opacity:0}
.krater.on{opacity:1}
.krater svg{width:100%;height:100%;display:block;overflow:visible}
.wine{transform-origin:50% 100%}
.krater b{position:absolute;left:0;right:0;bottom:-5cqh;text-align:center;font-size:4.2cqh;font-weight:800;font-variant-numeric:tabular-nums}

/* sophists: absolute so they can reorder */
.sophists{position:absolute;left:10%;right:10%;bottom:6.5cqh;height:30cqh;z-index:2;transition:opacity 400ms}
.soph{position:absolute;bottom:0;width:14cqh;text-align:center;transition:left 700ms cubic-bezier(.4,0,.2,1),opacity 600ms,transform 600ms;transform:translateX(-50%)}
.soph svg.fig{width:100%;height:19cqh;display:block;overflow:visible;filter:drop-shadow(-.8cqh .4cqh .6cqh rgba(0,0,0,.5))}
.plaque{background:var(--marble);color:var(--carve);padding:.9cqh 1cqh .7cqh;margin-top:.4cqh;
  clip-path:polygon(2% 0,98% 0,100% 8%,100% 92%,98% 100%,2% 100%,0 92%,0 8%);box-shadow:0 .8cqh 1.6cqh rgba(0,0,0,.55)}
.plaque .n{font-size:2.2cqh;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--marble-3);line-height:1}
.plaque .s{font-size:3.8cqh;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.soph.lead .plaque{background:linear-gradient(180deg,#F5EFE0,var(--marble))}.soph.lead .plaque .s{color:var(--wine)}
.d{position:absolute;left:0;right:0;top:-3.6cqh;font-size:3cqh;font-weight:800;color:var(--ember);opacity:0;transition:opacity 300ms;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.d.on{opacity:1}
.wreath{position:absolute;top:-1.4cqh;left:50%;transform:translateX(-50%);width:8cqh;height:3.6cqh;display:none}
.soph.lead .wreath{display:block}
.fx{position:absolute;left:50%;top:1cqh;transform:translateX(-50%);width:11cqh;height:14cqh;opacity:0;transition:opacity 400ms;pointer-events:none}
.fx svg{width:100%;height:100%;overflow:visible}
.soph.iced .fx.ice{opacity:1}.soph.inked .fx.ink{opacity:1}
.soph.iced svg.fig{filter:drop-shadow(0 0 1cqh var(--ice)) saturate(.3) brightness(1.2)}
.soph.inked svg.fig{filter:brightness(.55)}
.soph.out{opacity:0;transform:translateX(-50%) translateY(8cqh) scale(.9)}
.soph.out .plaque{background:var(--marble-3)}
.tv.socrates-phase .sophists,.tv.steal .sophists{opacity:.6}
.tv.lobby .sophists,.tv.announce .sophists{opacity:0}
/* the steal token */
.token{position:absolute;width:5cqh;height:6cqh;z-index:4;opacity:0;transition:left 1.1s cubic-bezier(.3,0,.2,1),bottom 1.1s cubic-bezier(.3,-.6,.2,1.3),opacity 300ms}
.token svg{width:100%;height:100%}

/* socrates */
.socrates{position:absolute;left:7%;bottom:9cqh;width:12cqh;height:30cqh;transform-origin:50% 100%;transition:transform 450ms,left 450ms;z-index:2;filter:drop-shadow(-1cqh .5cqh .8cqh rgba(0,0,0,.55))}
.socrates svg{width:100%;height:100%;display:block;overflow:visible}
.tv.socrates-phase .socrates,.tv.steal .socrates{left:12%;transform:scale(1.35)}
.tv.lobby .socrates,.tv.announce .socrates{transform:scale(1.15);left:44%}
.tv.gameover .socrates{left:40%;transform:scale(1.3)}

/* announce / lobby / gameover overlays */
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;transition:opacity 400ms;z-index:3;pointer-events:none}
.overlay.on{opacity:1}
.overlay .n{font-size:3cqh;letter-spacing:.35em;text-transform:uppercase;color:var(--ember);font-weight:700}
.overlay .t{font-family:var(--serif);font-size:16cqh;font-weight:700;line-height:1;color:var(--marble);margin-top:.6cqh;text-shadow:0 .6cqh 3cqh rgba(0,0,0,.8)}
.overlay .r{font-size:3.4cqh;color:var(--marble-2);margin-top:2.2cqh;max-width:40ch;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#lobby{display:grid;grid-template-columns:1.1fr 1fr;gap:5%;align-items:start;padding:8% 8% 0;place-items:start;text-align:left}
.brand{font-family:var(--serif);font-size:13cqh;font-weight:700;line-height:.95;text-shadow:0 .6cqh 3cqh rgba(0,0,0,.8)}
.brand small{display:block;font-family:var(--font);font-size:3cqh;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ember);margin-top:1.6cqh}
.join{position:relative;background:var(--marble);color:var(--carve);padding:4cqh 5cqh;display:grid;grid-template-columns:1fr auto;gap:3cqh;align-items:center;clip-path:var(--slab);filter:drop-shadow(0 2cqh 3cqh rgba(0,0,0,.6))}
.join .l{font-size:2.4cqh;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--marble-3)}
.join .code{font-size:12cqh;font-weight:900;line-height:1;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.join .u{font-size:2.5cqh;font-weight:700;color:var(--wine)}
.qr{width:20cqh;height:20cqh;background:repeating-conic-gradient(var(--carve) 0 25%,transparent 0 50%) 0 0/10% 10%}
#gameover .t{font-size:11cqh}
.leaves{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.leaves i{position:absolute;top:-6cqh;width:2.6cqh;height:1cqh;background:var(--olive);border-radius:50%;opacity:0}

.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bar button{background:var(--night-1);color:var(--marble);border:1px solid rgba(237,230,214,.25);padding:8px 12px;border-radius:4px;font:inherit;font-size:13px;font-weight:600;min-height:44px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--wine-2);border-color:var(--wine-2)}
.bar button.auto[aria-pressed=true]{background:var(--olive);color:var(--night-0);border-color:var(--olive)}
.bar button:focus-visible{outline:2px solid var(--marble);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="tv-wrap">
<div class="tv" id="tv">

<div class="scene">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070C18"/><stop offset=".55" stop-color="#13213D"/><stop offset=".85" stop-color="#5A3350"/><stop offset="1" stop-color="#8A4A3E"/></linearGradient>
  <filter id="marble" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="4" seed="3" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 -1.4 1.1" result="v"/><feGaussianBlur in="v" stdDeviation=".6" result="vb"/><feComposite in="vb" in2="SourceGraphic" operator="in"/></filter>
  <linearGradient id="tierL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9D0BC"/><stop offset=".5" stop-color="#A89E88"/><stop offset="1" stop-color="#4A4436"/></linearGradient>
  <linearGradient id="orch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDE6D6"/><stop offset="1" stop-color="#A89E88"/></linearGradient>
  <radialGradient id="torch"><stop offset="0" stop-color="#FFD98A" stop-opacity=".95"/><stop offset=".35" stop-color="#E8A14A" stop-opacity=".35"/><stop offset="1" stop-color="#E8A14A" stop-opacity="0"/></radialGradient>
  <radialGradient id="moon"><stop offset="0" stop-color="#F6F0DC"/><stop offset=".5" stop-color="#F6F0DC"/><stop offset=".55" stop-color="#F6F0DC" stop-opacity=".25"/><stop offset="1" stop-color="#F6F0DC" stop-opacity="0"/></radialGradient>
  <linearGradient id="fig" x1="0" x2="1"><stop offset="0" stop-color="#6E5A40"/><stop offset=".45" stop-color="#2A2218"/><stop offset="1" stop-color="#120E0A"/></linearGradient>
  <linearGradient id="trunk" x1="0" x2="1"><stop offset="0" stop-color="#6B5A3E"/><stop offset=".6" stop-color="#2E2618"/><stop offset="1" stop-color="#15110A"/></linearGradient>
  <radialGradient id="leafg"><stop offset="0" stop-color="#8C9A55"/><stop offset="1" stop-color="#2E3A1B"/></radialGradient>
  <linearGradient id="acro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B3550"/><stop offset="1" stop-color="#0C1526"/></linearGradient>
  <radialGradient id="vig" cx=".5" cy=".55" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<g id="stars" fill="#EDE6D6"></g>
<circle cx="1080" cy="110" r="60" fill="url(#moon)"/>
<!-- the Acropolis above the koilon: rock, Parthenon silhouette, moonlit -->
<path d="M0 320 C160 280 320 300 480 262 C600 236 720 246 860 226 C1000 206 1140 250 1280 232 L1280 360 L0 360Z" fill="url(#acro)"/>
<path d="M470 262 C520 232 600 224 660 222 L820 222 C880 226 940 236 980 262 Z" fill="#1A2238"/>
<g transform="translate(725 222)" fill="#2E3A5A">
  <rect x="-120" y="-4" width="240" height="4"/><rect x="-110" y="-38" width="220" height="5"/><path d="M-116 -38 L0 -64 L116 -38 Z"/>
  <g id="acols"></g>
</g>
<g id="tiers"></g><g id="crowd"></g>
<ellipse cx="640" cy="640" rx="560" ry="120" fill="url(#orch)"/>
<ellipse cx="640" cy="640" rx="560" ry="120" fill="#EDE6D6" filter="url(#marble)" opacity=".9"/>
<ellipse cx="640" cy="640" rx="548" ry="110" fill="none" stroke="#8F8672" stroke-width="2" opacity=".5"/>
<ellipse cx="640" cy="640" rx="200" ry="40" fill="none" stroke="#8F8672" stroke-width="2" opacity=".35"/>
<rect x="620" y="610" width="40" height="26" fill="#CFC5B0"/><rect x="614" y="606" width="52" height="8" fill="#EDE6D6"/>
<ellipse class="flame" cx="640" cy="600" rx="8" ry="12" fill="#FFD98A"/><circle class="glow" cx="640" cy="606" r="90" fill="url(#torch)" opacity=".7"/>
<g id="torches"></g><g id="motes" fill="#FFD98A"></g>
<g id="olive" transform="translate(60 720)">
  <path d="M40 0 C36 -80 60 -140 30 -230 L58 -232 C70 -150 62 -90 74 0Z" fill="url(#trunk)"/>
  <path d="M46 -160 C20 -190 -10 -200 -30 -240 L-18 -246 C0 -210 30 -200 52 -172Z" fill="url(#trunk)"/>
  <path d="M56 -200 C90 -230 120 -240 150 -290 L160 -282 C130 -240 100 -226 66 -192Z" fill="url(#trunk)"/>
  <g class="leaf" id="leaves"></g>
</g>
<rect width="1280" height="720" fill="url(#vig)"/>
</svg>
</div>

<div class="slab" id="main"><div class="vein"><svg viewBox="0 0 800 400" preserveAspectRatio="none"><rect width="800" height="400" fill="#EDE6D6" filter="url(#marble)"/></svg></div><div class="lit"></div><div id="mainc"></div></div>
<div class="slab" id="speech"><div class="vein"><svg viewBox="0 0 800 200" preserveAspectRatio="none"><rect width="800" height="200" fill="#EDE6D6" filter="url(#marble)"/></svg></div><div class="lit"></div><div id="speechc"></div></div>

<div class="krater" id="krater"><svg viewBox="0 0 100 180">
  <path d="M14 8 H86 L80 40 Q50 60 20 40 Z" fill="none" stroke="#EDE6D6" stroke-width="3"/>
  <path d="M20 40 Q50 60 80 40 L74 120 Q50 132 26 120 Z" fill="none" stroke="#EDE6D6" stroke-width="3"/>
  <clipPath id="bowl"><path d="M21 41 Q50 60 79 41 L73 119 Q50 130 27 119 Z"/></clipPath>
  <g clip-path="url(#bowl)"><rect class="wine" id="wine" x="0" y="0" width="100" height="132" fill="#5B1424"/><rect x="0" y="0" width="100" height="132" fill="#8E2440" opacity=".25"/></g>
  <path d="M42 120 L58 120 L60 150 L40 150 Z" fill="#EDE6D6"/><rect x="28" y="150" width="44" height="8" fill="#EDE6D6"/>
  <path d="M8 26 Q0 44 14 50 M92 26 Q100 44 86 50" fill="none" stroke="#EDE6D6" stroke-width="3"/>
</svg><b id="tval">14</b></div>

<div class="socrates"><svg viewBox="0 0 120 300">
  <defs><linearGradient id="him" x1="0" x2="1"><stop offset="0" stop-color="#F5EFE0"/><stop offset=".45" stop-color="#B8AD95"/><stop offset="1" stop-color="#5A5242"/></linearGradient>
  <linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#E8C49A"/><stop offset=".5" stop-color="#A07A54"/><stop offset="1" stop-color="#4A3524"/></linearGradient></defs>
  <ellipse cx="60" cy="296" rx="40" ry="6" fill="#000" opacity=".4"/>
  <path d="M60 300 L18 300 C14 230 24 160 36 128 L50 118 L70 118 L84 128 C96 160 106 230 102 300 Z" fill="url(#him)"/>
  <path d="M42 130 C34 180 44 240 34 300 L52 300 C50 240 58 180 54 130 Z" fill="#5A5242" opacity=".35"/>
  <path d="M84 126 L110 100 L116 106 L92 136 Z" fill="url(#sk)"/>
  <g class="hand"><path d="M20 180 C4 166 4 148 16 142 L30 156 Z" fill="url(#sk)"/></g>
  <circle cx="60" cy="86" r="30" fill="url(#sk)"/>
  <path d="M32 94 C36 130 84 130 88 94 C80 116 40 116 32 94 Z" fill="#EDE6D6"/>
  <path d="M30 80 C34 60 86 60 90 80 C82 70 38 70 30 80 Z" fill="#EDE6D6" opacity=".7"/>
</svg></div>

<div class="sophists" id="sophists"></div>
<div class="token" id="token"><svg viewBox="0 0 50 60"><path d="M12 8 H38 L34 22 Q40 40 30 56 H20 Q10 40 16 22 Z" fill="#8E2440" stroke="#EDE6D6" stroke-width="2"/><path d="M8 14 Q2 22 10 28 M42 14 Q48 22 40 28" fill="none" stroke="#EDE6D6" stroke-width="2"/></svg></div>

<div class="overlay" id="announce"><div><div class="n" id="an">Πρώτο στάδιο</div><div class="t" id="at">Η Αγορά</div><div class="r" id="ar"></div></div></div>
<div class="overlay" id="lobby"><div class="brand">Αιγαίον<small>Ο Σωκράτης εναντίον των Σοφιστών</small></div><div class="join"><div><div class="l">Κωδικός</div><div class="code">0042</div><div class="u">demboyz11.duckdns.org</div></div><div class="qr"></div></div></div>
<div class="overlay" id="gameover"><div><div class="n">Ο μαθητής</div><div class="t" id="winner">Ελένη</div><div class="r">Η γνώση, όπως πάντα, μας διέφυγε. Ένας από εσάς όμως, λιγότερο.</div></div></div>
<div class="leaves" id="leaves-fall"></div>

</div>
</div>

<div class="bar" role="group" aria-label="Φάση">
  <button data-phase="lobby">Lobby</button><button data-phase="announce">Stage</button><button data-phase="powerup">Power-up</button>
  <button data-phase="question">Question</button><button data-phase="reveal">Reveal</button><button data-phase="steal">Steal</button>
  <button data-phase="socrates">Socrates</button><button data-phase="draw">Draw</button><button data-phase="guess">Guess</button>
  <button data-phase="numeric">Numeric</button><button data-phase="trial">Trial</button><button data-phase="gameover">Game over</button>
  <button data-mood="cheer">cheer</button><button data-mood="boo">boo</button><button class="auto" id="auto" aria-pressed="false">▶ Auto</button>
</div>

<script>
const S=id=>document.getElementById(id);
let seed=17;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
{let s='';for(let i=0;i<70;i++)s+=`<circle class="star" cx="${rnd()*1280}" cy="${rnd()*230}" r="${.6+rnd()*1.2}" opacity="${.3+rnd()*.6}" style="animation-delay:${-rnd()*3}s"/>`;S('stars').innerHTML=s;}
{let c='';for(let i=0;i<8;i++)c+=`<rect x="${-104+i*30}" y="-33" width="7" height="29"/>`;S('acols').innerHTML=c;}
const CX=640,CY=700,tiers=[];for(let i=0;i<7;i++)tiers.push({rx:620+i*90,ry:170+i*46});
{let t='';for(let i=tiers.length-1;i>=0;i--){const {rx,ry}=tiers[i],rx2=rx-40,ry2=ry-34;
  t+=`<path d="M${CX-rx} ${CY} A${rx} ${ry} 0 0 1 ${CX+rx} ${CY} L${CX+rx2} ${CY} A${rx2} ${ry2} 0 0 0 ${CX-rx2} ${CY} Z" fill="url(#tierL)" opacity="${.55+i*.06}"/><path d="M${CX-rx} ${CY} A${rx} ${ry} 0 0 1 ${CX+rx} ${CY}" fill="none" stroke="#EDE6D6" stroke-width="2" opacity=".25"/>`;}S('tiers').innerHTML=t;}
{let c='';for(let i=0;i<tiers.length;i++){const {rx,ry}=tiers[i],r=rx-18,rr=ry-16,n=Math.round(26+i*6);let row='';
  for(let k=0;k<=n;k++){const a=Math.PI+(k/n)*Math.PI+(rnd()-.5)*.02,x=CX+r*Math.cos(a),y=CY+rr*Math.sin(a);if(y>CY-30)continue;
    const h=(26-i*2.2)*(.85+rnd()*.3),w=h*.55,arm=rnd()<.3;
    row+=`<g><ellipse cx="${x}" cy="${y-h*.35}" rx="${w}" ry="${h*.5}" fill="url(#fig)"/><circle cx="${x}" cy="${y-h*.95}" r="${h*.28}" fill="url(#fig)"/>${arm?`<g class="arm"><rect x="${x+w*.5}" y="${y-h*1.05}" width="${h*.13}" height="${h*.6}" rx="2" fill="url(#fig)" transform="rotate(25 ${x+w*.55} ${y-h*.5})"/></g>`:''}</g>`;}
  c+=`<g class="tier">${row}</g>`;}S('crowd').innerHTML=c;}
{let t='',m='';const pts=[[110,612],[260,556],[1020,556],[1170,612]];
 for(const [x,y] of pts){t+=`<circle class="glow" cx="${x}" cy="${y-40}" r="110" fill="url(#torch)" opacity=".75"/><rect x="${x-3}" y="${y-40}" width="6" height="60" fill="#2A2218"/><ellipse class="flame" cx="${x}" cy="${y-52}" rx="9" ry="16" fill="#FFD98A"/>`;
  for(let k=0;k<10;k++)m+=`<circle class="mote" cx="${x+(rnd()-.5)*90}" cy="${y-20+(rnd()-.5)*60}" r="${.8+rnd()*1.4}" style="animation-duration:${5+rnd()*6}s;animation-delay:${-rnd()*8}s"/>`;}
 S('torches').innerHTML=t;S('motes').innerHTML=m;}
{let l='';const cl=[[10,-270,120,70],[110,-300,130,72],[-40,-230,90,52],[170,-250,100,58],[60,-330,110,60]];
 for(const [x,y,rx,ry] of cl){l+=`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#leafg)"/>`;
  for(let k=0;k<26;k++){const a=rnd()*6.28,d=rnd(),px=x+Math.cos(a)*rx*d,py=y+Math.sin(a)*ry*d;l+=`<ellipse cx="${px}" cy="${py}" rx="9" ry="3" transform="rotate(${rnd()*180} ${px} ${py})" fill="#9AA860" opacity="${.35+rnd()*.5}"/>`;}}
 S('leaves').innerHTML=l;}

/* ---------- players ---------- */
const P=[{n:'Ελένη',s:1450},{n:'Νίκος',s:1200},{n:'Μαρία',s:980},{n:'Γιώργος',s:760},{n:'Κώστας',s:410}];
const hues=['#C9B7A0','#9FB2C2','#C2A08F','#A8B29A','#B7A6C4'];
function sophist(i){const f=i%2?-1:1;return `<svg class="fig" viewBox="0 0 120 200"><g transform="translate(60 0) scale(${f} 1) translate(-60 0)">
 <ellipse cx="60" cy="196" rx="30" ry="5" fill="#000" opacity=".4"/><path d="M60 200 L24 200 C22 150 30 110 40 88 L52 80 L68 80 L80 88 C90 110 98 150 96 200 Z" fill="${hues[i]}"/>
 <path d="M44 90 C38 130 44 170 40 200 L54 200 C52 170 58 130 54 90 Z" fill="#000" opacity=".22"/><path d="M80 88 L100 66 L106 72 L86 96 Z" fill="#A07A54"/>
 <circle cx="60" cy="58" r="22" fill="#B58C63"/><path d="M40 52 C44 34 76 34 80 52 C74 44 46 44 40 52Z" fill="#2A2218"/></g></svg>`;}
const wreath=`<svg class="wreath" viewBox="0 0 90 40"><path d="M45 34 Q10 30 6 8 Q30 6 45 34 Q60 6 84 8 Q80 30 45 34" fill="none" stroke="#9AA860" stroke-width="3"/><g fill="#9AA860"><ellipse cx="18" cy="18" rx="7" ry="3" transform="rotate(-40 18 18)"/><ellipse cx="30" cy="26" rx="7" ry="3" transform="rotate(-30 30 26)"/><ellipse cx="72" cy="18" rx="7" ry="3" transform="rotate(40 72 18)"/><ellipse cx="60" cy="26" rx="7" ry="3" transform="rotate(30 60 26)"/></g></svg>`;
const ice=`<div class="fx ice"><svg viewBox="0 0 60 80"><g stroke="#BFE6FF" stroke-width="3" stroke-linecap="round" fill="none"><path d="M30 6 V74 M8 20 L52 60 M52 20 L8 60 M30 6 L22 14 M30 6 L38 14 M30 74 L22 66 M30 74 L38 66"/></g><circle cx="30" cy="40" r="6" fill="#BFE6FF"/></svg></div>`;
const ink=`<div class="fx ink"><svg viewBox="0 0 60 80"><path d="M30 10 C50 10 58 30 50 44 C60 56 40 74 30 66 C18 76 2 58 12 44 C2 30 12 10 30 10Z" fill="#12101A"/><circle cx="22" cy="30" r="4" fill="#3A3650"/></svg></div>`;
const sopEl=S('sophists');
sopEl.innerHTML=P.map((p,i)=>`<div class="soph" data-i="${i}"><div class="d"></div>${ice}${ink}${sophist(i)}${wreath}<div class="plaque"><div class="n">${p.n}</div><div class="s">${p.s}</div></div></div>`).join('');
const sops=[...document.querySelectorAll('.soph')];
function layout(){const order=[...P.keys()].filter(i=>!P[i].out).sort((a,b)=>P[b].s-P[a].s);
  const n=order.length;order.forEach((i,rank)=>{const el=sops[i];el.style.left=((rank+.5)/n*100)+'%';el.classList.toggle('lead',rank===0);});
  P.forEach((p,i)=>{if(p.out)sops[i].classList.add('out');});}
function tween(i,to,ms=1800){const el=sops[i].querySelector('.s'),from=P[i].s,t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else{P[i].s=to;layout();}})(t0);}
layout();

/* ---------- content ---------- */
const question=`<div class="cat">Αρχαία Ελλάδα · 3 από 5</div><div class="q">Ποιος φιλόσοφος ήταν δάσκαλος του Μεγάλου Αλεξάνδρου;</div><div class="opts" style="display:none"><div class="opt ok">Αριστοτέλης</div><div class="opt">Πλάτων</div><div class="opt">Σωκράτης</div><div class="opt">Διογένης</div></div>`;
const owl=`<svg viewBox="0 0 200 200"><g fill="none" stroke="#12102A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="stroke"><path d="M60 60 Q100 20 140 60 L150 150 Q100 190 50 150 Z"/><circle cx="78" cy="90" r="16"/><circle cx="122" cy="90" r="16"/><circle cx="78" cy="90" r="5" fill="#12102A"/><circle cx="122" cy="90" r="5" fill="#12102A"/><path d="M100 104 L92 118 L108 118 Z"/><path d="M60 60 L54 40 M140 60 L146 40 M70 140 Q100 160 130 140"/></g></svg>`;
const numQ=`<div class="cat">Εκτίμηση · 2 από 3</div><div class="q">Πόσα μέτρα ψηλός είναι ο βράχος της Ακρόπολης;</div>`;
let timer=null,secs=14;
function startTimer(from=14){clearInterval(timer);secs=from;S('tval').textContent=secs;S('wine').style.transition='none';S('wine').style.transform=`scaleY(${secs/20})`;
  requestAnimationFrame(()=>{S('wine').style.transition='transform 1s linear';});
  timer=setInterval(()=>{secs--;if(secs<0){clearInterval(timer);return;}S('tval').textContent=secs;S('wine').style.transform=`scaleY(${secs/20})`;},1000);}
function stopTimer(){clearInterval(timer);S('tval').textContent='';S('wine').style.transform='scaleY(0)';}

/* ---------- phases ---------- */
const tv=S('tv');
function reset(){tv.className='tv';['main','speech','krater','announce','lobby','gameover'].forEach(id=>S(id).classList.remove('on'));
  sops.forEach(el=>{el.classList.remove('iced','inked');el.querySelector('.d').classList.remove('on');});S('token').style.opacity=0;}
const phases={
 lobby(){tv.classList.add('lobby');S('lobby').classList.add('on');},
 announce(t='Η Αγορά',n='Πρώτο στάδιο',r='Πέντε ερωτήσεις. Η σωστή απάντηση φέρνει πόντους· η γρήγορη, περισσότερους.'){tv.classList.add('announce');S('at').textContent=t;S('an').textContent=n;S('ar').textContent=r;S('announce').classList.add('on');},
 powerup(){tv.classList.add('dimmed');S('mainc').innerHTML=`<div class="cat">Σαμποτάζ</div><div class="q">Οι σοφιστές διαλέγουν στόχο.</div><div class="mid">Ο πάγος παγώνει τα χέρια πέντε δευτερόλεπτα. Το μελάνι θολώνει τις επιλογές.</div>`;S('main').classList.add('on');
   setTimeout(()=>{sops[0].classList.add('iced');sops[2].classList.add('inked');},900);},
 question(){tv.classList.add('dimmed');S('mainc').innerHTML=question;S('main').classList.add('on');S('krater').classList.add('on');startTimer(14);sops[0].classList.add('iced');sops[2].classList.add('inked');},
 reveal(){tv.classList.add('dimmed','reveal');S('mainc').innerHTML=question;S('mainc').querySelector('.opts').style.display='grid';S('main').classList.add('on');S('krater').classList.add('on');stopTimer();
   setTimeout(()=>{[[0,240],[1,180]].forEach(([i,d])=>{const el=sops[i].querySelector('.d');el.textContent='+'+d;el.classList.add('on');tween(i,P[i].s+d);});},500);
   setTimeout(()=>{tv.classList.add('cheer');setTimeout(()=>tv.classList.remove('cheer'),1600);},700);},
 steal(){tv.classList.add('steal');S('speechc').textContent='Η Ελένη πρώτη, και άρπαξε 320 από τον Νίκο. Στην Αθήνα αυτό το λέγαμε πολιτική.';S('speech').classList.add('on');
   const from=sops[1],to=sops[0],tk=S('token');tk.style.transition='none';tk.style.left=from.style.left;tk.style.bottom='22cqh';tk.style.opacity=1;
   requestAnimationFrame(()=>requestAnimationFrame(()=>{tk.style.transition='';tk.style.left=to.style.left;tk.style.bottom='30cqh';}));
   setTimeout(()=>{tk.style.opacity=0;tween(1,P[1].s-320,900);tween(0,P[0].s+320,900);const d=sops[1].querySelector('.d');d.textContent='−320';d.classList.add('on');},1200);
   setTimeout(()=>{tv.classList.add('boo');setTimeout(()=>tv.classList.remove('boo'),1600);},1300);},
 socrates(){tv.classList.add('socrates-phase');S('speechc').textContent='Ένας μόνο. Οι υπόλοιποι μόλις έχασαν λίγη αξιοπρέπεια.';S('speech').classList.add('on');},
 draw(){tv.classList.add('dimmed');S('mainc').innerHTML=`<div class="cat">Ζωγραφική · γύρος 1</div><div class="drawing"><div class="canvas">${owl}</div><div><div class="q">Η Μαρία ζωγραφίζει.</div><div class="mid">Οι υπόλοιποι περιμένουν, και ετοιμάζουν τις εικασίες τους.</div></div></div>`;S('main').classList.add('on');S('krater').classList.add('on');startTimer(18);},
 guess(){tv.classList.add('dimmed');S('mainc').innerHTML=`<div class="cat">Τι ζωγράφισε η Μαρία;</div><div class="drawing"><div class="canvas">${owl.replace('class="stroke"','')}</div><div class="opts" style="grid-template-columns:1fr"><div class="opt">Αετός</div><div class="opt ok">Κουκουβάγια</div><div class="opt">Γεράκι</div><div class="opt">Περιστέρι</div></div></div>`;S('main').classList.add('on');S('krater').classList.add('on');startTimer(10);},
 numeric(){tv.classList.add('dimmed','reveal');S('mainc').innerHTML=numQ+`<div class="numline"><i style="left:12%" data-l="Κώστας 90"></i><i style="left:34%" data-l="Νίκος 120"></i><i class="truth" style="left:52%" data-l="156"></i><i style="left:58%" data-l="Ελένη 160"></i><i style="left:80%" data-l="Μαρία 210"></i></div>`;S('main').classList.add('on');
   setTimeout(()=>{const d=sops[0].querySelector('.d');d.textContent='+400';d.classList.add('on');tween(0,P[0].s+400);},600);},
 trial(){tv.classList.add('dimmed');S('mainc').innerHTML=`<div class="cat">Η Δίκη · γύρος 4</div><div class="q">Ο πάτος της Αγοράς έχει κι αυτός τον φύλακά του.</div><div class="mid">Ο Κώστας δεν έχει πόντους να χάσει. Η πόλη αποφάσισε.</div>`;S('main').classList.add('on');
   setTimeout(()=>{P[4].out=true;layout();tv.classList.add('boo');setTimeout(()=>tv.classList.remove('boo'),1600);},1200);},
 gameover(){tv.classList.add('gameover');S('gameover').classList.add('on');const w=S('leaves-fall');w.innerHTML='';
   for(let i=0;i<60;i++){const l=document.createElement('i');l.style.left=(rnd()*100)+'%';l.style.setProperty('--dx',((rnd()-.5)*20)+'cqh');l.className='fall';l.style.animationDuration=(4+rnd()*4)+'s';l.style.animationDelay=(rnd()*3)+'s';w.appendChild(l);}
   setTimeout(()=>{tv.classList.add('cheer');},400);}
};
function setPhase(p,...a){reset();stopTimer();phases[p](...a);document.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.phase===p));}
document.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>{stopAuto();setPhase(b.dataset.phase);}));
document.querySelectorAll('[data-mood]').forEach(b=>b.addEventListener('click',()=>{tv.classList.remove('cheer','boo');tv.classList.add(b.dataset.mood);setTimeout(()=>tv.classList.remove(b.dataset.mood),1800);}));

/* ---------- autoplay: the whole show ---------- */
const script=[['lobby',5000],['announce',3500,'Η Αγορά','Πρώτο στάδιο','Πέντε ερωτήσεις. Η σωστή απάντηση φέρνει πόντους· η γρήγορη, περισσότερους.'],['powerup',4500],['question',6000],['reveal',5500],['socrates',5000],
 ['announce',3500,'Ζωγραφική','Δεύτερο στάδιο','Ζωγραφίστε καθαρά, σαν να σας βλέπει όλη η πόλη. Γιατί σας βλέπει.'],['draw',5500],['guess',5000],
 ['announce',3500,'Εκτίμηση','Τρίτο στάδιο','Ένας αριθμός. Ο κοντινότερος κερδίζει· ο ακριβής, περισσότερο.'],['numeric',5500],
 ['announce',3500,'Η Συκοφαντία','Τέταρτο στάδιο','Από εδώ και πέρα, ό,τι κερδίσετε το παίρνετε από κάποιον άλλον.'],['question',6000],['reveal',5000],['steal',6000],
 ['announce',3500,'Η Δίκη','Πέμπτο στάδιο','Οι πόντοι γίνονται ζωή. Όποιος μείνει χωρίς, φεύγει.'],['trial',5500],['gameover',7000]];
let auto=null,idx=0;
function runAuto(){const [p,ms,...a]=script[idx%script.length];setPhase(p,...a);idx++;auto=setTimeout(runAuto,ms);S('auto').setAttribute('aria-pressed','true');}
function stopAuto(){clearTimeout(auto);auto=null;S('auto').setAttribute('aria-pressed','false');}
S('auto').addEventListener('click',()=>{if(auto)stopAuto();else{idx=0;runAuto();}});
setPhase('socrates');
</script>
</body>
</html>
