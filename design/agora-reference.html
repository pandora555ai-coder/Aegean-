<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aegean — Η Μνήμη της Αγοράς v1</title>
<style>
:root{
  --night-0:#070C18; --night-1:#13213D; --dusk:#5A3350; --ember:#E8A14A;
  --marble:#EDE6D6; --marble-2:#CFC5B0; --marble-3:#8F8672; --carve:#2B2418;
  --wine:#5B1424; --wine-2:#8E2440; --olive:#9AA860; --ice:#BFE6FF;
  --font:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --serif:"Gentium Book Plus",Georgia,"Times New Roman",serif;
  --slab:polygon(1.5% 0,98.5% .6%,100% 3%,99.4% 97%,98% 100%,2% 99.4%,0 96%,.6% 3%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--marble);font-family:var(--font)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.tv-wrap{width:min(100vw - 24px,calc((100vh - 90px) * 16 / 9));aspect-ratio:16/9;position:relative}
.tv{position:absolute;inset:0;overflow:hidden;container-type:size;background:var(--night-0)}
.world{position:absolute;inset:0;transition:filter 600ms ease}
.tv.hidden-scene .world{filter:brightness(.55)}
#mkt{transition:opacity 600ms ease}
.tv.hidden-scene #mkt{opacity:0}
.world > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){
  .flame{animation:flick .17s steps(2) infinite alternate;transform-origin:50% 100%}
  @keyframes flick{to{transform:scale(1.12,.92);opacity:.85}}
  .star{animation:tw 3s ease-in-out infinite alternate}
  @keyframes tw{to{opacity:.25}}
  .tv.asking .socr-hand{animation:speak 2.6s ease-in-out infinite;transform-origin:15% 90%}
  @keyframes speak{40%{transform:rotate(-14deg)}70%{transform:rotate(5deg)}}
}
.socrates{position:absolute;left:1.8%;bottom:4%;width:7.4cqh;height:18cqh;z-index:2;
  filter:drop-shadow(-.6cqh .3cqh .55cqh rgba(0,0,0,.55))}
.socrates svg{width:100%;height:100%;display:block;overflow:visible}
/* exposure timer — draining bar in a marble groove */
#expo{position:absolute;left:20%;right:20%;bottom:3.5cqh;height:2.6cqh;z-index:4;
  background:rgba(0,0,0,.45);clip-path:var(--slab);display:none}
#expo i{position:absolute;inset:.5cqh;background:linear-gradient(90deg,var(--wine-2),var(--ember));
  transform-origin:left center}
/* overlays */
.panel{position:absolute;z-index:5;background:linear-gradient(175deg,var(--marble),var(--marble-2));
  color:var(--carve);clip-path:var(--slab);box-shadow:0 1cqh 4cqh rgba(0,0,0,.6)}
#intro{left:22%;right:22%;top:26%;padding:5cqh;text-align:center;display:none}
#intro h1{font-family:var(--serif);font-size:9cqh;line-height:1}
#intro p{font-size:3.4cqh;margin-top:2cqh;color:#5A5242}
#qpanel{left:12%;right:12%;top:8%;padding:3.6cqh 4.5cqh;display:none;text-align:center}
#qtag{font-size:2.6cqh;letter-spacing:.22em;text-transform:uppercase;color:var(--wine-2);font-weight:700}
#qtext{font-family:var(--serif);font-size:5.4cqh;line-height:1.15;font-weight:700;margin-top:1cqh}
#opts{position:absolute;left:12%;right:12%;bottom:7%;z-index:5;display:none;
  grid-template-columns:1fr 1fr;gap:2.2cqh}
.opt{background:linear-gradient(175deg,var(--marble),var(--marble-2));color:var(--carve);
  clip-path:var(--slab);border:none;cursor:pointer;padding:3cqh 2cqh;
  font-family:var(--serif);font-size:4.2cqh;font-weight:700;display:flex;align-items:center;justify-content:center;gap:1.6cqh}
.opt:hover{filter:brightness(1.06)}
.opt .sw{width:4cqh;height:4cqh;border-radius:50%;border:.4cqh solid rgba(43,36,24,.5);flex:none}
.opt.right{background:linear-gradient(175deg,#B7C48F,var(--olive));}
.opt.wrong{background:linear-gradient(175deg,#C77383,var(--wine-2));color:var(--marble)}
.opt:disabled{cursor:default}
#result{left:20%;right:20%;top:6%;padding:3cqh 4cqh;display:none;text-align:center}
#result h2{font-family:var(--serif);font-size:6.5cqh}
#result .ln{font-size:3.1cqh;margin-top:1.2cqh;color:#403A2C;text-align:left}
#result .ln b{color:var(--wine-2)}
.btnrow{margin-top:2.4cqh;display:flex;gap:2cqh;justify-content:center}
.btn{background:var(--wine-2);color:var(--marble);border:none;clip-path:var(--slab);
  padding:1.8cqh 4cqh;font-family:var(--serif);font-size:3.6cqh;font-weight:700;cursor:pointer}
.btn.sec{background:var(--marble-3)}
#hud{position:absolute;top:2.5cqh;left:3cqh;z-index:6;font-size:2.4cqh;color:var(--marble-3)}
#params{width:min(100vw - 24px,1200px);font:12px/1.5 monospace;color:#777;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div class="tv-wrap"><div class="tv" id="tv">
  <div class="world" id="world"></div>
  <div class="socrates"><svg viewBox="0 0 120 300">
    <defs><linearGradient id="him" x1="0" x2="1"><stop offset="0" stop-color="#F5EFE0"/><stop offset=".45" stop-color="#B8AD95"/><stop offset="1" stop-color="#5A5242"/></linearGradient>
    <linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#E8C49A"/><stop offset=".5" stop-color="#A07A54"/><stop offset="1" stop-color="#4A3524"/></linearGradient></defs>
    <ellipse cx="60" cy="296" rx="40" ry="6" fill="#000" opacity=".4"/>
    <path d="M60 300 L18 300 C14 230 24 160 36 128 L50 118 L70 118 L84 128 C96 160 106 230 102 300 Z" fill="url(#him)"/>
    <path d="M42 130 C34 180 44 240 34 300 L52 300 C50 240 58 180 54 130 Z" fill="#5A5242" opacity=".35"/>
    <path d="M84 126 L110 100 L116 106 L92 136 Z" fill="url(#sk)"/>
    <g class="socr-hand"><path d="M20 180 C4 166 4 148 16 142 L30 156 Z" fill="url(#sk)"/></g>
    <circle cx="60" cy="86" r="30" fill="url(#sk)"/>
    <path d="M32 94 C36 130 84 130 88 94 C80 116 40 116 32 94 Z" fill="#EDE6D6"/>
    <path d="M30 80 C34 60 86 60 90 80 C82 70 38 70 30 80 Z" fill="#EDE6D6" opacity=".7"/>
  </svg></div>
  <div id="expo"><i id="expofill"></i></div>
  <div id="hud"></div>
  <div class="panel" id="intro">
    <h1>Η Μνήμη της Αγοράς</h1>
    <p>Η αγορά ανοίγει για δέκα μόνο δευτερόλεπτα.<br>Κοίτα προσεκτικά — μετά, θα ρωτήσει ο Σωκράτης.</p>
    <div class="btnrow"><button class="btn" id="startBtn">Ανοίξτε την αγορά</button></div>
  </div>
  <div class="panel" id="qpanel"><div id="qtag"></div><div id="qtext"></div></div>
  <div id="opts" style="display:none"></div>
  <div class="panel" id="result">
    <h2 id="score"></h2><div id="lines"></div>
    <div class="btnrow">
      <button class="btn" id="againBtn">Νέος γύρος</button>
      <button class="btn sec" id="paramsBtn">Παράμετροι</button>
    </div>
  </div>
</div></div>
<pre id="params"></pre>
<script>
/* ---------- seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let seed=Math.floor(Math.random()*1e9), rnd=mulberry32(seed);
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=arr=>arr[Math.floor(rnd()*arr.length)];
const shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- vocabulary ---------- */
const STALLS={
  amphorae:{label:"τους αμφορείς", one:"αμφορέα", many:"αμφορείς", who:"ο αμφορέας"},
  fish:{label:"τα ψάρια", one:"ψάρι", many:"ψάρια", who:"ο ψαράς"},
  cloth:{label:"τα υφάσματα", one:"τόπι ύφασμα", many:"τόπια ύφασμα", who:"ο υφαντής"},
  pottery:{label:"τα κεραμικά", one:"πιθάρι", many:"πιθάρια", who:"ο κεραμέας"},
  fruit:{label:"τους καρπούς", one:"καλάθι", many:"καλάθια", who:"ο οπωροπώλης"}
};
const STALL_KEYS=Object.keys(STALLS);
const COLORS=[
  {k:"wine", name:"κρασάτη", hex:"#8E2440"},
  {k:"olive",name:"λαδί",    hex:"#9AA860"},
  {k:"ember",name:"ώχρα",    hex:"#E8A14A"},
  {k:"dusk", name:"πορφυρή", hex:"#5A3350"},
  {k:"white",name:"λευκή",  hex:"#EDE6D6"}
];
const ANIMALS={dog:{name:"σκύλος",acc:"σκύλο"},goat:{name:"κατσίκα",acc:"κατσίκα"},
  geese:{name:"χήνες",acc:"χήνες"},cat:{name:"γάτα",acc:"γάτα"}};

/* ---------- generation ---------- */
let G=null;
function generate(){
  rnd=mulberry32(seed);
  const types=shuffle(STALL_KEYS).slice(0,3);          // two types always absent
  const cols=shuffle(COLORS);
  const stalls=types.map((t,i)=>({type:t,color:cols[i],count:ri(2,5),pos:i}));
  const animals={dog:rnd()<.5,goat:rnd()<.5,cat:rnd()<.5,geeseN:rnd()<.55?ri(1,3):0};
  animals.geese=animals.geeseN>0;
  G={seed,stalls,animals,absentStalls:STALL_KEYS.filter(k=>!types.includes(k))};
  return G;
}

/* ---------- questions (truth table from params only) ---------- */
function buildQuestions(){
  const qs=[];
  /* Q1 easy — existence. Prefer "which WAS there": 1 present + 3 absent. */
  const presentPool=[], absentPool=[];
  for(const k in ANIMALS){ (G.animals[k]?presentPool:absentPool).push({t:"animal",k}); }
  const twins={amphorae:"pottery",pottery:"amphorae"};
  G.absentStalls.forEach(a=>{
    if(!G.stalls.some(st=>st.type===twins[a]))absentPool.push({t:"stall",k:a});
  });
  G.stalls.forEach(s=>presentPool.push({t:"stall",k:s.type}));
  const nameOf=e=>e.t==="animal"?ANIMALS[e.k].name:"πάγκος με "+STALLS[e.k].label;
  let q1;
  if(absentPool.length>=3){
    const right=pick(presentPool);
    q1={tag:"ΕΥΚΟΛΗ",text:"Ποιο από αυτά ΥΠΗΡΧΕ στην αγορά;",
        opts:shuffle([right,...shuffle(absentPool).slice(0,3)]).map(nameOf),
        right:nameOf(right), subject:right};
  }else{
    const right=pick(absentPool);
    q1={tag:"ΕΥΚΟΛΗ",text:"Ποιο από αυτά ΔΕΝ υπήρχε στην αγορά;",
        opts:shuffle([right,...shuffle(presentPool).slice(0,3)]).map(nameOf),
        right:nameOf(right), subject:right};
  }
  qs.push(q1);
  /* Q2 medium — awning colour of a unique-by-construction stall */
  const s2=pick(G.stalls);
  const others=shuffle(COLORS.filter(c=>c.k!==s2.color.k)).slice(0,3);
  qs.push({tag:"ΜΕΤΡΙΑ",text:"Τι χρώμα είχε η τέντα στον πάγκο με "+STALLS[s2.type].label+";",
    opts:shuffle([s2.color,...others]).map(c=>({name:c.name,hex:c.hex})),
    right:s2.color.name, subject:{t:"stall",k:s2.type}});
  /* Q3 hard — count (a stall's goods, or the geese if present and different stall picked) */
  let s3=pick(G.stalls.filter(s=>s.type!==s2.type));
  let n=s3.count, noun=STALLS[s3.type].many, subj={t:"stall",k:s3.type};
  if(G.animals.geeseN>0&&rnd()<.35){n=G.animals.geeseN;noun="χήνες";subj={t:"animal",k:"geese"};}
  const base=Math.max(1,n-ri(1,2));
  const set=[...new Set([base,base+1,base+2,base+3])];
  qs.push({tag:"ΔΥΣΚΟΛΗ",text:noun==="χήνες"?"Πόσες χήνες τριγύριζαν στην αγορά;"
      :"Πόσα "+noun+" είχε "+STALLS[s3.type].who+";",
    opts:shuffle(set).map(String), right:String(n), subject:subj});
  return qs;
}

/* ---------- scene rendering ---------- */
const NS="http://www.w3.org/2000/svg";
function el(n,at,parent){const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e}
function renderScene(highlight){
  const W=1600,H=900, svg=el("svg",{viewBox:`0 0 ${W} ${H}`});
  const dr=mulberry32(seed^0x9e3779b9);                 // decor-only rng
  const dri=(a,b)=>a+Math.floor(dr()*(b-a+1));
  /* sky */
  el("rect",{x:0,y:0,width:W,height:H*.645,fill:"url(#sky)"},svg);
  const defs=el("defs",{},svg);
  const grad=el("linearGradient",{id:"sky",x1:0,y1:0,x2:0,y2:1},defs);
  el("stop",{offset:0,"stop-color":"#070C18"},grad);
  el("stop",{offset:1,"stop-color":"#13213D"},grad);
  for(let i=0;i<70;i++)el("circle",{cx:dri(0,W),cy:dri(0,H*.4),r:dr()<.85?1.3:2.2,fill:"#F6F0DC",
    opacity:.3+dr()*.6,class:"star"},svg);
  el("circle",{cx:W*.86,cy:H*.13,r:38,fill:"#F6F0DC",opacity:.92},svg);
  el("circle",{cx:W*.845,cy:H*.122,r:34,fill:"#0b1226",opacity:.55},svg);
  /* distant acropolis */
  const far=el("g",{transform:`translate(0 ${H*.125})`},svg);
  el("path",{d:`M0 ${H*.52} L${W*.18} ${H*.44} L${W*.3} ${H*.47} L${W*.42} ${H*.40} L${W*.55} ${H*.46} L${W*.7} ${H*.42} L${W} ${H*.5} L${W} ${H*.52} Z`,fill:"#0d1428"},far);
  const tx=W*.42,ty=H*.335;
  for(let c=0;c<6;c++)el("rect",{x:tx-42+c*15,y:ty+14,width:6,height:34,fill:"#232B44"},far);
  el("path",{d:`M${tx-52} ${ty+14} L${tx} ${ty-6} L${tx+52} ${ty+14} Z`,fill:"#2A3350"},far);
  el("rect",{x:tx-52,y:ty+48,width:104,height:8,fill:"#232B44"},far);
  const mkt=el("g",{id:"mkt"},svg);
  /* ground — torch-lit market, much brighter than the theatre floor */
  const gg=el("linearGradient",{id:"gr",x1:0,y1:0,x2:0,y2:1},defs);
  el("stop",{offset:0,"stop-color":"#4A3A22"},gg);
  el("stop",{offset:1,"stop-color":"#2E2416"},gg);
  el("rect",{x:0,y:H*.645,width:W,height:H*.355,fill:"url(#gr)"},mkt);
  el("rect",{x:0,y:H*.645,width:W,height:14,fill:"#5A4830"},mkt);
  const glow=el("radialGradient",{id:"glow"},defs);
  el("stop",{offset:0,"stop-color":"#FFD98A","stop-opacity":.28},glow);
  el("stop",{offset:1,"stop-color":"#FFD98A","stop-opacity":0},glow);
  [.185,.5,.815].forEach(fx=>el("ellipse",{cx:W*fx,cy:H*.72,rx:W*.17,ry:H*.26,fill:"url(#glow)"},svg));
  for(let i=0;i<20;i++)el("ellipse",{cx:dri(0,W),cy:dri(H*.9,H*.985),rx:dri(20,60),ry:4,
    fill:"#241C12",opacity:.35},mkt);
  /* stalls — 3 huge, goods stand FREE below a high awning */
  const w=W*.26, slots=[.185,.5,.815];
  G.stalls.forEach((s,i)=>{
    const cx=W*slots[i], x=cx-w/2, y=H*.44, g=el("g",{},mkt);
    if(highlight&&highlight.t==="stall"&&highlight.k===s.type)
      el("rect",{x:x-20,y:y-46,width:w+40,height:H*.44,fill:"none",
        stroke:"#FFD98A","stroke-width":8,rx:18},g);
    el("rect",{x:x,y:y+26,width:18,height:H*.36,fill:"#3A2E1E"},g);        // posts
    el("rect",{x:x+w-18,y:y+26,width:18,height:H*.36,fill:"#3A2E1E"},g);
    el("path",{d:`M${x-20} ${y+30} L${cx} ${y-42} L${x+w+20} ${y+30} Z`,fill:s.color.hex},g);
    el("path",{d:`M${x-20} ${y+30} L${x+w+20} ${y+30} L${x+w+12} ${y+52} L${x-12} ${y+52} Z`,
      fill:s.color.hex,opacity:.75},g);
    const ty=H*.76;                                                        // table top
    el("rect",{x:x-10,y:ty,width:w+20,height:20,fill:"#5A4426"},g);
    el("rect",{x:x+6,y:ty+20,width:14,height:H*.10,fill:"#3A2E1E"},g);
    el("rect",{x:x+w-20,y:ty+20,width:14,height:H*.10,fill:"#3A2E1E"},g);
    drawGoods(g,s,x,ty,w);
  });
  /* torches between & beside stalls */
  [.05,.3425,.6575,.95].forEach(fx=>{
    const x=W*fx,y=H*.62;
    el("rect",{x:x-5,y:y,width:10,height:H*.26,fill:"#3A2E1E"},mkt);
    el("ellipse",{cx:x,cy:y-16,rx:15,ry:26,fill:"#E8A14A",class:"flame"},mkt);
    el("ellipse",{cx:x,cy:y-22,rx:8,ry:14,fill:"#FFD98A",class:"flame"},mkt);
  });
  /* animals — big, in the bright foreground strip */
  const AY=H*.955;
  const big=(fn,fx,dy,hl)=>{const g=el("g",
    {transform:`translate(${W*fx} ${AY+dy}) scale(1.7)`},mkt);fn(g,0,0,hl)};
  if(G.animals.dog)big(drawDog,.13,-6,highlight&&highlight.k==="dog");
  if(G.animals.goat)big(drawGoat,.60,-10,highlight&&highlight.k==="goat");
  if(G.animals.cat)big(drawCat,.925,-14,highlight&&highlight.k==="cat");
  for(let i=0;i<G.animals.geeseN;i++)
    big(drawGoose,.33+i*.05,(i%2)*-10,highlight&&highlight.k==="geese");
  world.replaceChildren(svg);
}
function drawGoods(g,s,x,ty,w){
  const n=s.count, pad=55, step=n>1?(w-2*pad)/(n-1):0;
  for(let i=0;i<n;i++){
    const gx=x+pad+(n===1?(w/2-pad):i*step), gy=ty;
    if(s.type==="amphorae"){
      el("path",{d:`M${gx-6} ${gy} L${gx+6} ${gy} L${gx+16} ${gy-28} Q${gx+20} ${gy-58} ${gx+9} ${gy-74} L${gx-9} ${gy-74} Q${gx-20} ${gy-58} ${gx-16} ${gy-28} Z`,fill:"#B98A5E",stroke:"#6e4c2e","stroke-width":3},g);
      el("rect",{x:gx-11,y:gy-86,width:22,height:12,fill:"#8a6644"},g);
      el("path",{d:`M${gx-15} ${gy-74} q-13 10 -2 22 M${gx+15} ${gy-74} q13 10 2 22`,stroke:"#8a6644","stroke-width":5,fill:"none"},g);
    }else if(s.type==="fish"){
      el("path",{d:`M${gx-26} ${gy-34} Q${gx} ${gy-58} ${gx+18} ${gy-34} Q${gx} ${gy-12} ${gx-26} ${gy-34} Z`,fill:"#BFE6FF",stroke:"#5f7d96","stroke-width":3},g);
      el("path",{d:`M${gx+18} ${gy-34} L${gx+34} ${gy-46} L${gx+34} ${gy-22} Z`,fill:"#BFE6FF",stroke:"#5f7d96","stroke-width":3},g);
      el("circle",{cx:gx-16,cy:gy-38,r:3,fill:"#13213D"},g);
    }else if(s.type==="cloth"){
      el("rect",{x:gx-16,y:gy-84,width:32,height:84,rx:8,fill:i%2?"#C2A08F":"#8E9BAD",stroke:"#544636","stroke-width":3},g);
      el("path",{d:`M${gx-16} ${gy-64} h32 M${gx-16} ${gy-42} h32 M${gx-16} ${gy-20} h32`,stroke:"rgba(0,0,0,.25)","stroke-width":3},g);
    }else if(s.type==="pottery"){
      el("path",{d:`M${gx-24} ${gy} Q${gx-30} ${gy-34} ${gx} ${gy-40} Q${gx+30} ${gy-34} ${gx+24} ${gy} Z`,fill:"#9a6a44",stroke:"#5f3f26","stroke-width":3},g);
      el("ellipse",{cx:gx,cy:gy-40,rx:19,ry:6,fill:"#6e462c"},g);
    }else{ /* fruit */
      el("path",{d:`M${gx-28} ${gy-26} Q${gx} ${gy+4} ${gx+28} ${gy-26} L${gx+22} ${gy-2} Q${gx} ${gy+14} ${gx-22} ${gy-2} Z`,fill:"#8a6a3c",stroke:"#54401f","stroke-width":3},g);
      for(let f=0;f<5;f++)el("circle",{cx:gx-16+f*8,cy:gy-26,r:8,fill:f%2?"#8E2440":"#9AA860",stroke:"#3a2a10","stroke-width":2},g);
    }
  }
}
function ring(svg,x,y,r){el("circle",{cx:x,cy:y,r:r,fill:"none",stroke:"#FFD98A","stroke-width":5},svg)}
function drawDog(svg,x,y,hl){const C="#A07A54";if(hl)ring(svg,x,y-18,52);
  el("ellipse",{cx:x,cy:y-16,rx:34,ry:15,fill:C},svg);
  el("circle",{cx:x+32,cy:y-30,r:11,fill:C},svg);
  el("path",{d:`M${x+40} ${y-30} l14 4 l-14 5 Z`,fill:C},svg);
  el("path",{d:`M${x+26} ${y-39} l4 -11 l6 9 Z`,fill:C},svg);
  [[-24],[-8],[8],[24]].forEach(([dx])=>el("rect",{x:x+dx,y:y-6,width:6,height:19,fill:C},svg));
  el("path",{d:`M${x-32} ${y-20} q-14 -4 -12 -24`,stroke:C,"stroke-width":6,fill:"none"},svg);}
function drawGoat(svg,x,y,hl){if(hl)ring(svg,x,y-18,48);const C="#CFC5B0";
  el("ellipse",{cx:x,cy:y-16,rx:28,ry:15,fill:C},svg);
  el("circle",{cx:x-26,cy:y-30,r:9,fill:C},svg);
  el("path",{d:`M${x-30} ${y-38} q-8 -10 -2 -16`,stroke:C,"stroke-width":4,fill:"none"},svg);
  el("path",{d:`M${x-24} ${y-38} q0 -12 8 -14`,stroke:C,"stroke-width":4,fill:"none"},svg);
  [[-18],[-4],[10],[22]].forEach(([dx])=>el("rect",{x:x+dx,y:y-4,width:5,height:17,fill:C},svg));
  el("path",{d:`M${x-26} ${y-22} q-2 8 2 10`,stroke:"#8F8672","stroke-width":3,fill:"none"},svg);}
function drawGoose(svg,x,y,hl){if(hl)ring(svg,x,y-12,26);
  el("ellipse",{cx:x,cy:y-8,rx:14,ry:9,fill:"#EDE6D6"},svg);
  el("path",{d:`M${x+10} ${y-12} q4 -14 -2 -18`,stroke:"#EDE6D6","stroke-width":5,fill:"none"},svg);
  el("circle",{cx:x+7,cy:y-30,r:5,fill:"#EDE6D6"},svg);
  el("path",{d:`M${x+11} ${y-30} l8 2 l-8 3 Z`,fill:"#E8A14A"},svg);
  el("rect",{x:x-3,y:y,width:3,height:9,fill:"#E8A14A"},svg);
  el("rect",{x:x+3,y:y,width:3,height:9,fill:"#E8A14A"},svg);}
function drawCat(svg,x,y,hl){if(hl)ring(svg,x,y-10,32);
  el("ellipse",{cx:x,cy:y-6,rx:18,ry:10,fill:"#8F8672"},svg);
  el("circle",{cx:x-16,cy:y-16,r:8,fill:"#8F8672"},svg);
  el("path",{d:`M${x-21} ${y-22} l-2 -8 l6 4 Z M${x-13} ${y-23} l0 -8 l6 6 Z`,fill:"#8F8672"},svg);
  el("path",{d:`M${x+16} ${y-8} q14 -4 10 -18`,stroke:"#8F8672","stroke-width":4,fill:"none"},svg);}

/* ---------- flow ---------- */
const $=id=>document.getElementById(id);
const world=$("world"), tv=$("tv");
let QS=[], qi=0, correct=0, answers=[];
function show(id,on){$(id).style.display=on?(id==="opts"?"grid":"block"):"none"}
function setHud(){$("hud").textContent="seed "+seed}
function start(){
  generate(); QS=buildQuestions(); qi=0; correct=0; answers=[];
  renderScene(null); setHud();
  show("intro",false); show("result",false); tv.classList.remove("hidden-scene");
  const bar=$("expofill"); $("expo").style.display="block";
  bar.style.transition="none"; bar.style.transform="scaleX(1)";
  requestAnimationFrame(()=>{bar.style.transition="transform 10s linear";bar.style.transform="scaleX(0)"});
  setTimeout(()=>{ $("expo").style.display="none"; tv.classList.add("hidden-scene"); ask(); },10000);
}
function ask(){
  const q=QS[qi];
  $("qtag").textContent=q.tag+" — "+(qi+1)+"/3";
  $("qtext").textContent=q.text;
  const box=$("opts"); box.replaceChildren();
  q.opts.forEach(o=>{
    const b=document.createElement("button"); b.className="opt";
    if(typeof o==="object"){const s=document.createElement("i");s.className="sw";s.style.background=o.hex;
      b.appendChild(s);b.appendChild(document.createTextNode(o.name));b.dataset.v=o.name;}
    else{b.textContent=o;b.dataset.v=o;}
    b.onclick=()=>answer(b,q); box.appendChild(b);
  });
  show("qpanel",true); show("opts",true); tv.classList.add("asking");
}
function answer(btn,q){
  [...$("opts").children].forEach(b=>{b.disabled=true;
    if(b.dataset.v===q.right)b.classList.add("right");});
  const ok=btn.dataset.v===q.right; if(!ok)btn.classList.add("wrong");
  if(ok)correct++;
  answers.push({q:q.text,right:q.right,ok});
  /* proof beat: verdict flash, then clean highlighted scene */
  setTimeout(()=>{show("qpanel",false);show("opts",false);tv.classList.remove("asking");
    tv.classList.remove("hidden-scene");renderScene(q.subject);},900);
  setTimeout(()=>{
    tv.classList.add("hidden-scene");
    qi++;
    if(qi<3)setTimeout(ask,650); else setTimeout(finish,650);
  },3200);
}
function finish(){
  tv.classList.remove("hidden-scene"); renderScene(null);
  $("score").textContent=correct+"/3 σωστές";
  $("lines").replaceChildren(...answers.map(a=>{
    const d=document.createElement("div");d.className="ln";
    d.innerHTML=(a.ok?"✔":"✘")+" "+a.q+" — <b>"+a.right+"</b>";return d;}));
  show("result",true);
  $("params").textContent=JSON.stringify({seed,
    stalls:G.stalls.map(s=>({type:s.type,color:s.color.name,count:s.count})),
    animals:G.animals,absent:G.absentStalls,
    questions:QS.map(q=>({tag:q.tag,text:q.text,right:q.right}))},null,2);
}
$("startBtn").onclick=start;
$("againBtn").onclick=()=>{seed=Math.floor(Math.random()*1e9);start()};
$("paramsBtn").onclick=()=>{const p=$("params");p.style.display=p.style.display==="block"?"none":"block"};
generate(); renderScene(null); setHud(); show("intro",true);
</script>
